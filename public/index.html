<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f5132">
  <title>Minigiochi</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
  <link rel="stylesheet" href="/common.css">
  <style>
    .games { display: grid; gap: 14px; margin-top: 8px; }
    .game {
      display: flex; align-items: center; gap: 16px;
      padding: 18px; border-radius: var(--radius);
      background: var(--panel); border: 1px solid var(--panel-border);
      color: var(--text); text-decoration: none;
      transition: transform .12s, background .2s, border-color .2s;
    }
    .game:hover { background: rgba(255, 255, 255, 0.14); border-color: var(--accent); }
    .game:active { transform: scale(.98); }
    .game .icon { font-size: 2.6rem; line-height: 1; flex: none; width: 56px; text-align: center; }
    .game h2 { margin: 0 0 4px; }
    .game p { margin: 0; color: var(--muted); font-size: .92rem; }
    .game .go { margin-left: auto; color: var(--accent); font-size: 1.4rem; flex: none; }
    .tag-mp { font-size: .72rem; font-weight: 600; color: var(--accent-text); background: var(--accent); padding: 1px 7px; border-radius: 999px; }
  </style>
</head>
<body>
  <main id="app">
    <header class="hero">
      <div class="logo">🎲</div>
      <h1>Minigiochi</h1>
      <p class="sub">Scegli a cosa giocare.</p>
    </header>

    <nav class="games" aria-label="Minigiochi">
      <a class="game" href="/carte/">
        <span class="icon">🃏</span>
        <div>
          <h2>Carte Random <span class="tag-mp">multiplayer</span></h2>
          <p>Crea una stanza e dai una carta a caso a ogni giocatore.</p>
        </div>
        <span class="go" aria-hidden="true">›</span>
      </a>
      <a class="game" href="/fiches/">
        <span class="icon">🪙</span>
        <div>
          <h2>Conta fiches</h2>
          <p>Conta le fiches di ogni giocatore a poker e calcola chi paga chi.</p>
        </div>
        <span class="go" aria-hidden="true">›</span>
      </a>
    </nav>
  </main>
</body>
</html>
